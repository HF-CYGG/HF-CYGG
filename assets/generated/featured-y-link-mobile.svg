<svg id="gh-dark-mode-only" xmlns="http://www.w3.org/2000/svg" width="180" height="150" viewBox="0 0 180 150" role="img" aria-labelledby="title description">
  <title id="title">Y-Link</title>
  <desc id="description">文创产品出入库与 O2O 预订系统。覆盖预订、核销、库存、供货与权限安全。Vue 3。TypeScript。Express。MySQL。线上预订 · 权限安全。Onebox 部署</desc>
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }

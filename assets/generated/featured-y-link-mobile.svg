  <rect class="pill" x="24" y="116" width="56" height="22" rx="5" />
  <text class="pill-text" x="34" y="131">Vue 3</text>
  <rect class="pill" x="88" y="116" width="92" height="22" rx="5" />
  <text class="pill-text" x="98" y="131">TypeScript</text>
  <rect class="pill" x="188" y="116" width="70" height="22" rx="5" />
  <text class="pill-text" x="198" y="131">Express</text>
  <rect class="pill" x="266" y="116" width="56" height="22" rx="5" />
  <text class="pill-text" x="276" y="131">MySQL</text>
  <text class="muted" x="24" y="188">线上预订 · 库存流转 · 客户反馈</text>

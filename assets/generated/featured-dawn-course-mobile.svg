<svg id="gh-dark-mode-only" xmlns="http://www.w3.org/2000/svg" width="180" height="150" viewBox="0 0 180 150" role="img" aria-labelledby="title description">
  <title id="title">Dawn Course / 破晓课程表</title>
  <desc id="description">免费、轻量、开源的 Android 课程表 App。适配多类高校教务系统与本地课程管理。Kotlin。Jetpack Compose。Room。QuickJS。教务导入 · 提醒组件。备份同步</desc>
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .accent-line { fill: #6e7781; }
    .title, .link { fill: #0969da; }
    .body, .pill-text { fill: #24292f; }
    .muted { fill: #57606a; }
    .pill { fill: #eaeef2; }
    .title { font: 600 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body { font: 9.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { font: 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .pill-text { font: 600 8.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .link { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .accent-line { fill: #8c959f; }
      .title, .link { fill: #58a6ff; }
      .body, .pill-text { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .pill { fill: #21262d; }
    }
    #gh-dark-mode-only:target .card { fill: #161b22; stroke: #30363d; }
    #gh-dark-mode-only:target .accent-line { fill: #8c959f; }
    #gh-dark-mode-only:target .title,
    #gh-dark-mode-only:target .link { fill: #58a6ff; }
    #gh-dark-mode-only:target .body,
    #gh-dark-mode-only:target .pill-text { fill: #f0f6fc; }
    #gh-dark-mode-only:target .muted { fill: #8b949e; }
    #gh-dark-mode-only:target .pill { fill: #21262d; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="179" height="149" rx="10" />
  <rect class="accent-line" x="0" y="12" width="3" height="126" rx="1.5" />
  <text class="title" x="12" y="21">Dawn Course / 破晓</text>
  <text class="body" x="12" y="40">免费、轻量的 Android 课程表</text>
  <text class="body" x="12" y="54">适配多类高校教务系统</text>
  <rect class="pill" x="12" y="65" width="45" height="17" rx="4" />
  <text class="pill-text" x="19" y="77">Kotlin</text>
  <rect class="pill" x="62" y="65" width="50" height="17" rx="4" />
  <text class="pill-text" x="69" y="77">Compose</text>
  <rect class="pill" x="117" y="65" width="35" height="17" rx="4" />
  <text class="pill-text" x="124" y="77">Room</text>
  <rect class="pill" x="12" y="86" width="50" height="17" rx="4" />
  <text class="pill-text" x="19" y="98">QuickJS</text>
  <text class="muted" x="12" y="119">教务导入 · 提醒组件</text>
  <text class="muted" x="12" y="134">备份同步</text>
  <text class="link" x="168" y="21" text-anchor="end">↗</text>
</svg>

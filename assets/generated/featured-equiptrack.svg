<svg id="gh-dark-mode-only" xmlns="http://www.w3.org/2000/svg" width="370" height="118" viewBox="0 0 370 118" role="img" aria-labelledby="title description">
  <title id="title">EquipTrack</title>
  <desc id="description">面向高校组织的物资追踪与管理系统。覆盖登记、借用、审批与归还流程。Kotlin。Node.js。Docker。MySQL。物资追踪 · 权限流转 · 独立服务端</desc>
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .accent-line { fill: #6e7781; }
    .title, .link { fill: #0969da; }
    .body, .pill-text { fill: #24292f; }
    .muted { fill: #57606a; }
    .pill { fill: #eaeef2; }
    .title { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .body { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { font: 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .pill-text { font: 600 9.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .link { font: 600 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .accent-line { fill: #8c959f; }
      .title, .link { fill: #58a6ff; }
      .body, .pill-text { fill: #f0f6fc; }
      .muted { fill: #8b949e; }
      .pill { fill: #21262d; }
    }
    #gh-dark-mode-only:target .card { fill: #161b22; stroke: #30363d; }
    #gh-dark-mode-only:target .accent-line { fill: #8c959f; }
    #gh-dark-mode-only:target .title,
    #gh-dark-mode-only:target .link { fill: #58a6ff; }
    #gh-dark-mode-only:target .body,
    #gh-dark-mode-only:target .pill-text { fill: #f0f6fc; }
    #gh-dark-mode-only:target .muted { fill: #8b949e; }
    #gh-dark-mode-only:target .pill { fill: #21262d; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="369" height="117" rx="10" />
  <rect class="accent-line" x="0" y="14" width="3" height="90" rx="1.5" />
  <text class="title" x="16" y="22">EquipTrack</text>
  <text class="body" x="16" y="43">面向高校组织的物资追踪与管理系统</text>
  <text class="body" x="16" y="58">覆盖登记、借用、审批与归还流程</text>
  <rect class="pill" x="16" y="68" width="53" height="18" rx="4" />
  <text class="pill-text" x="24" y="81">Kotlin</text>
  <rect class="pill" x="75" y="68" width="59" height="18" rx="4" />
  <text class="pill-text" x="83" y="81">Node.js</text>
  <rect class="pill" x="140" y="68" width="53" height="18" rx="4" />
  <text class="pill-text" x="148" y="81">Docker</text>
  <rect class="pill" x="199" y="68" width="47" height="18" rx="4" />
  <text class="pill-text" x="207" y="81">MySQL</text>
  <text class="muted" x="16" y="106">物资追踪 · 权限流转 · 独立服务端</text>

  <rect class="pill" x="75" y="68" width="109" height="18" rx="4" />
  <text class="pill-text" x="83" y="81">Jetpack Compose</text>
  <rect class="pill" x="190" y="68" width="42" height="18" rx="4" />
  <text class="pill-text" x="198" y="81">Room</text>
  <rect class="pill" x="238" y="68" width="59" height="18" rx="4" />
